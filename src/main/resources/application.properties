spring.application.name=ai-dj-studio
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/ai_dj_studio
spring.r2dbc.username=${DB_USERNAME}
spring.r2dbc.password=${DB_PASSWORD}


# Flyway configuration
spring.flyway.url=jdbc:postgresql://localhost:5432/ai_dj_studio
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}


app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000

# LLM / RAG Q&A Configuration (F20)
app.llm.provider=${LLM_PROVIDER:fake}
app.llm.api-key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:gpt-4o-mini}
app.llm.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
